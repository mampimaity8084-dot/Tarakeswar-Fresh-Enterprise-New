<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tarakeswar Fresh Fish</title>
  <meta name="theme-color" content="#071b34">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--navy:#071b34;--green:#0c9b50;--bg:#f4f7fb;--card:#fff;--text:#162033;--muted:#6b7280;--gold:#f4b63c;--red:#d83a2e}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:20;background:white;padding:11px 14px;box-shadow:0 2px 12px #0001}
    .bar{max-width:1180px;margin:auto;display:flex;align-items:center;gap:11px}
    .logo{width:48px;height:48px;border-radius:50%;object-fit:cover}
    .brand{font-weight:900;color:var(--navy);font-size:18px}
    .spacer{flex:1}
    .wrap{max-width:1180px;margin:auto;padding:16px;padding-bottom:calc(185px + env(safe-area-inset-bottom))!important}
    .hero{background:linear-gradient(135deg,#0d2442,#087d49);color:white;border-radius:24px;padding:24px;margin-bottom:16px}
    .hero h1{margin:3px 0 8px;font-size:34px}
    .search{width:100%;padding:14px;border:0;border-radius:14px;margin-top:14px;font-size:16px}
    .panel{background:white;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 28px #0b1f330d}
    .cats{display:flex;gap:9px;overflow:auto;padding:2px 0 12px}
    .chip{white-space:nowrap;background:white;border:1px solid #dfe5ec;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}
    .chip.active{background:var(--navy);color:white}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .card{background:white;border-radius:18px;padding:14px;box-shadow:0 7px 22px #0b1f3310;position:relative}
    .card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px}
    .price{font-size:22px;font-weight:900}
    .btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
    .green{background:var(--green);color:white}
    .navy{background:var(--navy);color:white}
    .light{background:#eef2f7}
    .cartDock{position:fixed;left:12px;right:12px;bottom:calc(62px + env(safe-area-inset-bottom) + 8px);z-index:9990!important;background:#fff;border:1px solid #e6ebf0;border-radius:18px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 40px #071b3430}
    .appNav{position:fixed;bottom:0;left:0;right:0;height:calc(62px + env(safe-area-inset-bottom));z-index:10000!important;background:#fff;border-top:1px solid #e7ebef;display:flex!important;justify-content:space-between;pointer-events:auto!important}
    .appNav button{flex:1!important;min-height:50px!important;border:0;background:transparent;color:#5d6674;font-size:9px!important;font-weight:800;padding:4px 2px}
    .appNav span{display:block;color:#071b34;font-size:18px!important}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.hero h1{font-size:28px}}
  </style>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="native-config.js" onerror="this.remove()"></script>
  <!-- Runtime & V6 Final Logic -->
  <script src="ttf-v6-runtime.js" onerror="console.warn('runtime optional')"></script>
  <script src="ttf-v6-final.js" defer></script>
</head>
<body>

  <header>
    <div class="bar">
      <img src="logo-transparent.png" class="logo" alt="Logo" onerror="this.style.display='none'">
      <div class="brand">Tarakeswar Fresh Fish</div>
      <div class="spacer"></div>
    </div>
  </header>

  <main class="wrap">
    <!-- Smart Reorder & Member Special Sections -->
    <section class="panel" id="smartReorderPanel" style="display:none"></section>
    <section class="panel" id="memberSpecialPanel" style="background:linear-gradient(135deg,#071b34,#0a8a50);color:#white">
      <h2>আজকের Member Special</h2>
      <div id="memberSpecialContent"><p>Loading...</p></div>
    </section>

    <!-- Hero Banner -->
    <section class="hero">
      <h1>তাজা মাছ ও মাংস সরাসরি বাড়িতে 🐟🍗</h1>
      <p class="sub">তারকেশ্বর ও পার্শ্ববর্তী অঞ্চলের জন্য সেরা ডেলিভারি সার্ভিস।</p>
      <input type="search" id="searchInput" class="search" placeholder="কী কিনতে চান খুঁজুন (যেমন: রুই, চিকেন)...">
    </section>

    <!-- Categories -->
    <section class="panel">
      <h2>ক্যাটাগরি</h2>
      <div class="cats" id="catList">
        <button class="chip active" onclick="window.filterCat?.('all')">সব পণ্য</button>
        <button class="chip" onclick="window.filterCat?.('Fish')">🐟 মাছ</button>
        <button class="chip" onclick="window.filterCat?.('Chicken')">🍗 চিকেন & মটন</button>
        <button class="chip" onclick="window.filterCat?.('Dairy')">🥚 ডিম ও দুগ্ধজাত</button>
      </div>
    </section>

    <!-- Product Grid -->
    <section class="panel">
      <h2>আজকের তাজা স্টক</h2>
      <div class="grid" id="grid">
        <p class="muted">প্রডাক্ট লোড হচ্ছে...</p>
      </div>
    </section>

    <!-- AI Assistant Input Area -->
    <section class="panel">
      <h2>🤖 AI সহকারী</h2>
      <div style="display:flex;gap:8px">
        <input type="text" id="tffAiInput" class="search" style="margin:0" placeholder="বাংলায় লিখুন বা ভয়েস ব্যবহার করুন...">
        <button class="btn navy" onclick="window.aiAsk?.()">জিজ্ঞাসা করুন</button>
      </div>
    </section>
  </main>

  <!-- Bottom Cart Dock -->
  <div class="cartDock" id="cartDock" style="display:none">
    <div>
      <b id="cartCount">0 Items</b> | <span id="cartTotal" class="price" style="font-size:18px">₹0</span>
    </div>
    <button class="btn green checkoutBtn" onclick="window.openCheckout?.()">অর্ডার করুন 🛒</button>
  </div>

  <!-- Bottom Navigation -->
  <nav class="appNav">
    <button onclick="location.href='index.html'"><span>🏠</span>হোম</button>
    <button onclick="location.href='#grid'"><span>🐟</span>মাছ</button>
    <button onclick="location.href='#grid'"><span>🍗</span>মাংস</button>
    <button onclick="location.href='#tffAiInput'"><span>🤖</span>AI সহকারী</button>
    <button onclick="window.openCart?.()"><span>🛒</span>কার্ট</button>
  </nav>

</body>
</html>
